<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposals — StudentHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-brand"><span class="brand-icon">⬡</span><span class="brand-name">StudentHub</span></div>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Home</a>
      <a href="projects.html" class="nav-link">Projects</a>
      <a href="proposals.html" class="nav-link active">Proposals</a>
      <a href="ideas.html" class="nav-link">Ideas</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="profile.html" class="nav-link">Profile</a>
    </div>
    <button class="btn-post" onclick="window.location.href='proposals.html'">+ Submit</button>
  </nav>

  <header class="page-header">
    <h1>Project Proposals</h1>
    <p>Pitch your project idea and request mentorship. Mentors will review proposals on the Admin dashboard.</p>
  </header>

  <main class="page-content">
    <section style="max-width:800px;margin:0 auto">
      <div class="panel">
        <div class="modal-title">Submit a Proposal</div>
        <form id="proposal-form">
          <div class="form-group">
            <label class="form-label">Your name</label>
            <input class="form-input" id="p-name" placeholder="Full name" required />
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" id="p-email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label">GitHub username</label>
            <input class="form-input" id="p-github" placeholder="github.com/username" />
          </div>
          <div class="form-group">
            <label class="form-label">Project title</label>
            <input class="form-input" id="p-title" placeholder="Short project title" required />
          </div>
          <div class="form-group">
            <label class="form-label">Short abstract</label>
            <textarea class="form-textarea" id="p-abstract" placeholder="What you'll build and why" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Estimated timeline</label>
              <input class="form-input" id="p-timeline" placeholder="e.g., 10 weeks" />
            </div>
            <div class="form-group">
              <label class="form-label">Skills you need (comma separated)</label>
              <input class="form-input" id="p-skills" placeholder="Frontend, ML, DevOps" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-cancel" onclick="document.getElementById('proposal-form').reset()">Reset</button>
            <button type="submit" class="btn-submit">Submit Proposal</button>
          </div>
        </form>
      </div>

      <div style="height:1.25rem"></div>

      <div class="panel">
        <div class="modal-title">Your Submitted Proposals</div>
        <div id="proposals-list"></div>
      </div>
    </section>
  </main>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/proposals.js"></script>
</body>
</html>
